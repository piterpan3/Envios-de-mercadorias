<style>
:root{--bg:#04101F;--bg2:#071B31;--card:#0A2340;--b1:#1677FF;--b2:#35B8FF;--tx:#F4F8FF;--tx2:#91A8C2;--ok:#16D39A;--warn:#FFB020;--bd:rgba(53,184,255,.18);--bad:#FF5C6C}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{font:15px/1.55 'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom)}
a{color:var(--b2);text-decoration:none}h1,h2,h3{line-height:1.15}
.btn{display:inline-block;border:0;cursor:pointer;font:700 14px inherit;color:#fff;padding:12px 22px;border-radius:12px;background:linear-gradient(135deg,var(--b1),var(--b2));position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s;box-shadow:0 6px 24px rgba(22,119,255,.35)}
.btn:hover{transform:translateY(-2px)}.btn:after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);transform:translateX(-100%);transition:transform .6s}.btn:hover:after{transform:translateX(100%)}
.btn.g{background:transparent;border:1px solid var(--bd);box-shadow:none}.btn.s{padding:7px 12px;font-size:12px;border-radius:9px}.btn.r{background:var(--bad);box-shadow:none}.btn.o{background:var(--ok);color:#042}
:focus-visible{outline:2px solid var(--b2);outline-offset:2px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);color:var(--tx);padding:11px 13px;border-radius:10px;font:inherit;margin:4px 0 12px}
label{font-size:12px;color:var(--tx2);font-weight:500}
.card{background:linear-gradient(160deg,rgba(10,35,64,.95),rgba(7,27,49,.9));border:1px solid var(--bd);border-radius:18px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.wrap{max-width:1180px;margin:auto;padding:0 20px}.grid{display:grid;gap:16px}.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
header.top{position:fixed;inset:0 0 auto;z-index:20;background:rgba(4,16,31,.8);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);padding-top:env(safe-area-inset-top)}
header .wrap{display:flex;align-items:center;gap:22px;height:64px}nav.m{display:flex;gap:18px;margin-left:auto;font-size:14px}nav.m a{color:var(--tx2)}nav.m a:hover{color:var(--tx)}
.logo{font-weight:800;font-size:19px;letter-spacing:.5px;color:var(--tx);display:flex;align-items:center;gap:8px;animation:in .8s both}.logo svg{width:26px}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
section{padding:84px 0}h2.t{font-size:clamp(24px,4vw,36px);margin-bottom:28px;font-weight:800}
.hero{min-height:100vh;padding-top:110px;background:radial-gradient(900px 500px at 75% 20%,rgba(22,119,255,.28),transparent),linear-gradient(var(--bg),var(--bg2));position:relative;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:30px;align-items:center}
.hero h1{font-size:clamp(34px,6vw,64px);font-weight:800;letter-spacing:-1px}.hero h1 span{background:linear-gradient(90deg,var(--b1),var(--b2));-webkit-background-clip:text;color:transparent}
.hero small{color:var(--b2);font-weight:700;letter-spacing:2px}.hero p{color:var(--tx2);margin:14px 0}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.chip{padding:6px 13px;border:1px solid var(--bd);border-radius:99px;font-size:13px;color:var(--tx2)}
.cloud{position:absolute;width:260px;height:70px;border-radius:99px;background:rgba(53,184,255,.07);filter:blur(10px);animation:drift 60s linear infinite}@keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(110vw)}}
.float{animation:fl 7s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-10px)}}
.trust{background:var(--bg2);border-block:1px solid var(--bd);padding:24px 0}.trust .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--tx2);font-size:14px}.trust b{display:block;color:var(--tx)}
.card.h{transition:transform .25s,border-color .25s}.card.h:hover{transform:translateY(-4px);border-color:var(--b2)}
.step{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}.step i{flex:none;width:34px;height:34px;border-radius:50%;background:var(--b1);display:grid;place-items:center;font:700 13px inherit;font-style:normal}
.calc .res{font-size:42px;font-weight:800;color:var(--b2)}
.badge{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:rgba(145,168,194,.18)}
.Pendente,.Em\ análise{background:rgba(255,176,32,.18);color:var(--warn)}.Aprovada,.Pago,.Entregue{background:rgba(22,211,154,.18);color:var(--ok)}.Recusada,.Cancelada,.Cancelado{background:rgba(255,92,108,.18);color:var(--bad)}.Em\ trânsito,.Em\ entrega{background:rgba(53,184,255,.18);color:var(--b2)}
.tl{border-left:2px solid var(--bd);margin-left:8px;padding-left:18px}.tl div{position:relative;margin-bottom:14px}.tl div:before{content:"";position:absolute;left:-25px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--b2);box-shadow:0 0 12px var(--b2)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--tx2);font-weight:500}
footer{background:#030b16;padding:46px 0 90px;color:var(--tx2);font-size:14px;border-top:1px solid var(--bd)}footer h4{color:var(--tx);margin-bottom:8px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(800px 500px at 20% 10%,rgba(22,119,255,.3),transparent),var(--bg)}
.login .card{width:min(420px,100%);animation:side .7s both}@keyframes side{from{opacity:0;transform:translateX(60px)}}
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:var(--bg2);border-right:1px solid var(--bd);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.side a{display:block;padding:10px 12px;border-radius:10px;color:var(--tx2);font-size:14px;cursor:pointer}.side a.on,.side a:hover{background:rgba(22,119,255,.18);color:var(--tx)}
.main{padding:26px;min-width:0}.main h1{font-size:26px;margin-bottom:18px}.stat b{display:block;font-size:28px}.stat span{color:var(--tx2);font-size:13px}
.bar{height:8px;border-radius:9px;background:linear-gradient(90deg,var(--b1),var(--b2));margin:4px 0 10px}
.bn{display:none}.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--b2);padding:12px 18px;border-radius:12px;z-index:99;max-width:92vw;animation:in .3s}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;justify-content:flex-end}.drawer .side{display:block;height:100%;width:78%;position:static;animation:side .3s}
@media(max-width:860px){.hero .wrap{grid-template-columns:1fr}nav.m a:not(.btn){display:none}.shell{grid-template-columns:1fr}.shell>.side{display:none}.main{padding:16px 14px 90px}
.bn{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(7,27,49,.96);backdrop-filter:blur(14px);border-top:1px solid var(--bd);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.bn a{flex:1;text-align:center;font-size:11px;color:var(--tx2);padding:6px 0;cursor:pointer}.bn a.on{color:var(--b2)}.bn a b{display:block;font-size:19px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.splash{position:fixed;inset:0;z-index:200;background:radial-gradient(700px 400px at 50% 40%,rgba(22,119,255,.4),var(--bg));display:grid;place-content:center;justify-items:center;gap:14px;animation:in .3s both}
.splash svg{width:60px;color:#7fd4ff;filter:drop-shadow(0 0 14px #35B8FF);animation:takeoff 1.4s ease-in both}@keyframes takeoff{from{transform:translate(-40vw,30px) rotate(-8deg);opacity:0}30%{opacity:1}to{transform:translate(40vw,-60px) rotate(-8deg)}}
.splash h2{animation:in .6s .3s both}.sl{width:160px;height:3px;background:var(--bd);border-radius:9px;overflow:hidden}.sl i{display:block;height:100%;background:linear-gradient(90deg,var(--b1),var(--b2));animation:ld 1.3s ease-out both}@keyframes ld{from{width:0}to{width:100%}}
.main{animation:in .45s both}
@media(max-width:1100px){.hero .hr{position:static;margin-top:24px}}@media(max-width:860px){.lw{grid-template-columns:1fr}.lt .big,.lt p,.lt .rsvg{display:none}.lt{text-align:center}.fl{width:38px;height:26px}}

/* ===== animação das imagens ===== */
.hbg{transform:translate(var(--mx,0px),calc(var(--py,0px) + var(--my,0px)));transition:transform .25s ease-out}
.hbg:before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(circle at 68% 28%,rgba(255,170,90,.32),transparent 42%),radial-gradient(circle at 30% 80%,rgba(53,184,255,.18),transparent 40%);animation:glow2 9s ease-in-out infinite alternate}
.hbg:after{z-index:2}@keyframes glow2{from{opacity:.35;transform:scale(1)}to{opacity:1;transform:scale(1.12) translateX(-3%)}}
.sc .ph{position:relative;overflow:hidden;background-size:118%;animation:pan 16s ease-in-out infinite alternate}
.sv .card:nth-child(2n) .ph{animation-direction:alternate-reverse;animation-duration:19s}.sv .card:nth-child(3n) .ph{animation-duration:22s}
@keyframes pan{from{background-position:0% 40%;background-size:118%}to{background-position:100% 60%;background-size:134%}}
.sc:hover .ph{filter:brightness(1.18) saturate(1.25)}.sc .ph{transition:filter .4s}
.sc .ph:after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.26) 50%,transparent 60%);transform:translateX(-130%);animation:shn 7s ease-in-out infinite}
.sv .card:nth-child(1) .ph:after{animation-delay:.5s}.sv .card:nth-child(2) .ph:after{animation-delay:1.6s}.sv .card:nth-child(3) .ph:after{animation-delay:2.7s}.sv .card:nth-child(4) .ph:after{animation-delay:3.8s}.sv .card:nth-child(5) .ph:after{animation-delay:4.9s}.sv .card:nth-child(6) .ph:after{animation-delay:6s}
@keyframes shn{0%,70%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.sc.rv .ph{clip-path:inset(0 100% 0 0)}.sc.rv.in .ph{clip-path:inset(0);transition:clip-path 1.1s cubic-bezier(.2,.7,.2,1),filter .4s}
.ban{background-size:100% 100%,135% auto;animation:banpan 20s ease-in-out infinite alternate}@keyframes banpan{from{background-position:0 0,0% 50%}to{background-position:0 0,100% 50%}}
.strip{background-size:auto,125% auto;animation:strp 26s ease-in-out infinite alternate}@keyframes strp{from{background-position:0 0,0% 50%}to{background-position:0 0,100% 50%}}

 const priv=`<h1>Política de privacidade</h1><p>A ${c}${nif} trata os seus dados pessoais com respeito pela legislação aplicável, incluindo o Regulamento Geral sobre a Proteção de Dados (RGPD).</p><h3>Que dados recolhemos</h3><p>Nome, telefone, e-mail, moradas de entrega e os dados das suas encomendas (descrição, peso, origem e destino). Se entrar com Google, recebemos o seu nome e e-mail verificado.</p><h3>Para que os usamos</h3><p>Para criar a sua conta, analisar e executar as suas encomendas, comunicar consigo sobre o estado do transporte (incluindo por WhatsApp), prestar apoio e cumprir obrigações legais.</p><h3>Com quem os partilhamos</h3><p>Apenas com quem for necessário para realizar o transporte e a entrega, e com autoridades quando a lei o exigir. Não vendemos os seus dados.</p><h3>Quanto tempo os guardamos</h3><p>Pelo tempo necessário para prestar o serviço e cumprir obrigações legais e fiscais.</p><h3>Os seus direitos</h3><p>Pode pedir acesso, retificação, apagamento, limitação ou portabilidade dos seus dados, e opor-se ao tratamento, contactando-nos${em?' em '+em:''}. Pode também apresentar reclamação à autoridade de proteção de dados do seu país.</p><h3>Segurança e cookies</h3><p>As palavras-passe são guardadas de forma cifrada. Usamos apenas um cookie técnico de sessão, necessário para manter o seu login; não usamos cookies de publicidade.</p>`;
 const terms=`<h1>Termos e condições</h1><p>Ao usar este site e os serviços da ${c}${nif}, aceita estes termos.</p><h3>O serviço</h3><p>Transporte aéreo de mercadorias entre Angola e Portugal, nos dois sentidos. Fazer uma encomenda no site cria uma <b>solicitação</b>; só fica confirmada quando a ${c} a aprovar e lhe fornecer o código de rastreio.</p><h3>Preço e pagamento</h3><p>O valor estimado resulta do peso (kg) multiplicado pelo preço por kg em vigor. O pagamento é feito manualmente, segundo as instruções enviadas pela ${c} (por exemplo, via WhatsApp). A entrega ao domicílio em Angola tem custo à parte.</p><h3>Mercadorias</h3><p>O cliente declara que a mercadoria descrita é verdadeira e permitida por lei e pelas companhias aéreas. Não transportamos mercadorias proibidas ou perigosas, e podemos recusar ou reter envios que não cumpram as regras.</p><h3>Prazos e responsabilidade</h3><p>Os prazos são indicativos e podem variar por motivos alheios à ${c} (voos, alfândega, clima). A responsabilidade por perda ou dano é limitada nos termos da lei aplicável e das condições do transporte aéreo.</p><h3>Conta</h3><p>É responsável por manter a sua palavra-passe segura. Podemos suspender contas usadas de forma abusiva ou fraudulenta.</p><h3>Contacto</h3><p>${em?'Para qualquer questão: '+em+'.':'Contacte-nos através dos meios indicados no site.'}</p>`;

 const calc=()=>$('#cr').textContent=eur((parseFloat(val('cw'))||0)*P.price_per_kg);$('#cw').oninput=calc;initProof()}
async function doTrack(i,o){const out=$('#'+o);const ex=$('#exm');if(ex)ex.hidden=true;try{const t=await api('/track/'+encodeURIComponent(val(i)));out.innerHTML=trackHtml(t)}catch(e){out.innerHTML=`<p style="color:var(--warn)">${esc(e.message)}</p>`}}
const trackHtml=t=>`<div class="grid g4">${[['Código',t.code],['Cliente',t.client],['Origem',t.origin],['Destino',t.destination],['Peso',t.weight+' kg'],['Mercadoria',t.cargo],['Data',dt(t.date)],['Valor',eur(t.value)]].map(([a,b])=>`<div><label>${a}</label><br><b>${esc(b)}</b></div>`).join('')}</div><p style="margin:14px 0">${badge(t.status)}</p><div class="tl">${[...t.events].reverse().map((e,i)=>`<div style="animation-delay:${i*.18}s"><b>${esc(e.status)}</b> <small style="color:var(--tx2)">${dt(e.created_at)}</small>${e.note?`<br><small>${esc(e.note)}</small>`:''}</div>`).join('')}</div>`;

/* ---------- Login ---------- */
function loginView(reg){$('#app').innerHTML=`<div class="login"><div class="hbg"><div class="hi"></div></div><svg class="fly" viewBox="0 0 64 64" fill="currentColor" aria-hidden="true"><path d="M60 8 4 30l16 6 6 18 8-10 14 10z"/></svg><div class="lw"><div class="lt"><a class="logo" href="#/">${plane}<span>BENGA <b style="color:var(--b2)">ENVIOS</b><small>A tua encomenda, a nossa responsabilidade.</small></span></a><h2 class="big">O seu mundo,<br>sem limites.</h2><p>Transporte aéreo de mercadorias entre Angola e Portugal.</p>${routeSvg('hr3')}</div><div class="card lc"><h2>${reg?'Criar conta':'BEM-VINDO DE VOLTA!'}</h2><p style="color:var(--tx2);margin:6px 0 16px">${reg?'Registe-se para fazer encomendas.':'Faça o login na sua conta para continuar.'}</p>
${reg?field('Nome','rn')+field('Telefone','rp','tel'):''}${field('E-mail','le','email')}${field('Palavra-passe','lp','password')}<button class="btn" style="width:100%" id="go">${reg?'CRIAR CONTA':'ENTRAR'}</button>${P.google_client_id?'<div class="sep"><span>ou</span></div><div id="gbtn" style="display:flex;justify-content:center;min-height:44px"></div>':''}
<p style="margin-top:14px;font-size:13px"><a href="#" id="sw">${reg?'Já tenho conta':'Criar conta'}</a>${reg?'':' · <a href="#" onclick="forgotPw();return false">Esqueceu a palavra-passe?</a>'}</p></div></div></div>`;
 $('#sw').onclick=e=>{e.preventDefault();loginView(!reg)};
 initGoogle();
 $('#go').onclick=async()=>{try{const r=reg?await api('/auth/register','POST',{name:val('rn'),phone:val('rp'),email:val('le'),password:val('lp')}):await api('/auth/login','POST',{email:val('le'),password:val('lp')});
  me=await api('/me');await splash(me.name);go(r.role==='client'?'#/app/':'#/admin/')}catch(e){toast(e.message)}}}


/* ---------- Login com Google (só se GOOGLE_CLIENT_ID estiver configurado) ---------- */

 $('#pf_s').onclick=async()=>{await api('/me','PUT',{prefs:val('pf')});me=await api('/me');toast('Guardado.')}};

function splash(n){return new Promise(r=>{const d=document.createElement('div');d.className='splash';d.innerHTML=`<svg viewBox="0 0 64 64" fill="currentColor"><path d="M60 8 4 30l16 6 6 18 8-10 14 10z"/></svg><h2>Bem-vindo, ${esc(n.split(' ')[0])}</h2><div class="sl"><i></i></div>`;document.body.append(d);setTimeout(()=>{d.remove();r()},1500)})}

addEventListener('mousemove',e=>{const h=document.getElementById('hbg');if(!h)return;h.style.setProperty('--mx',((e.clientX/innerWidth-.5)*-18)+'px');h.style.setProperty('--my',((e.clientY/innerHeight-.5)*-10)+'px')},{passive:true});

const RLB={admin:'Administrador',staff:'Funcionário',client:'Cliente'};
function srch(e,base){if(e.key!=='Enter')return;const v=e.target.value.trim();if(!v)return;if(/^BEN-/i.test(v)){sessionStorage.c=v.toUpperCase();const t=base+'track';location.hash===t?route():go(t)}else{sessionStorage.q=v;const t=base+'orders';location.hash===t?route():go(t)}}
const donut=a=>{const tot=a.reduce((x,y)=>x+y.n,0),C=['#1677FF','#16D39A','#FFB020','#8B5CF6','#FF5C6C'];let acc=0;const seg=a.map((x,i)=>{const s=acc/tot*100;acc+=x.n;return `${C[i%5]} ${s}% ${acc/tot*100}%`}).join(',');
 return `<div class="dn"><div class="ring" style="background:conic-gradient(${seg||'#123 0 100%'})"><span><b>${tot}</b>Encomendas</span></div><div>${a.map((x,i)=>`<p><i style="background:${C[i%5]}"></i>${esc(x.r)} <b>${Math.round(x.n/(tot||1)*100)}% (${x.n})</b></p>`).join('')||'<small>Sem dados.</small>'}</div></div>`};
const byDest=o=>Object.entries(o.reduce((a,x)=>(a[x.destination]=(a[x.destination]||0)+1,a),{})).map(([r,n])=>({r,n}));
const ACT={approve:['✓','Encomenda aprovada'],refuse:['✕','Solicitação recusada'],status:['✈','Estado atualizado'],payment:['€','Pagamento atualizado'],order_create:['▤','Nova solicitação'],settings:['⚙','Configurações alteradas'],review:['★','Avaliação']};
const updList=a=>a.map(x=>{const[i,t]=ACT[x.action]||['•',x.action];return `<div class="up"><i>${i}</i><div><b>${esc(t)}</b><br><small>${esc(x.detail||'')}</small><br><small style="color:var(--tx2)">${dt(x.created_at)}</small></div></div>`}).join('')||'<small>Sem atividade.</small>';
AV['']=async m=>{const[s,o]=await Promise.all([api('/admin/stats'),api('/admin/orders')]);
 const ST=[['▤','Total de encomendas',s.total],['✈','Em trânsito',s.transit],['✓','Entregues',s.delivered],['⏳','Pendentes',s.pending],['☺','Clientes',s.clients],['€','Receita',eur(s.revenue)]];
 m.innerHTML=`<div class="ban"><h1>Olá, ${esc(me.name)} 👋</h1><p style="color:var(--tx2)">Bem-vindo(a) de volta!</p><b style="font-size:20px">Angola ↔ Portugal</b><br><small style="color:var(--tx2)">Painel administrativo — transporte aéreo de mercadorias</small></div>
 <div class="grid g4">${ST.map(([i,a,b])=>`<div class="card stat h"><i class="si">${i}</i><div><b ${typeof b==='number'?`data-n="${b}"`:''}>${b}</b><span>${a}</span></div></div>`).join('')}</div>
 <div class="dg"><div class="dl"><div class="card"><div class="ch"><h3>Encomendas recentes</h3><a href="#/admin/orders">Ver todas →</a></div>${tbl(['Código','Cliente','Rota','Estado','Peso','Valor',''],o.slice(0,5).map(x=>`<tr><td>${esc(x.tracking_code||'—')}</td><td>${esc(x.name)}</td><td>${esc(x.origin)} → ${esc(x.destination)}</td><td>${badge(x.status)}</td><td>${x.weight} kg</td><td>${eur(x.total_eur)}</td><td><a href="#/admin/orders">👁</a></td></tr>`))}</div>
 <div class="grid g2"><div class="card"><div class="ch"><h3>Últimas atualizações</h3></div>${updList(s.activity.slice(0,4))}</div><div class="card"><h3>Entregas por destino</h3><br>${donut(byDest(o))}</div></div></div>
 <div class="dr"><div class="card h"><h3>Aprovações pendentes</h3><b style="font-size:34px;display:block;margin:6px 0" data-n="${s.pending}">${s.pending}</b><p style="color:var(--tx2);margin-bottom:12px">Solicitações à espera de aprovação ou recusa.</p><a class="btn" href="#/admin/orders">Analisar solicitações →</a></div>
 <div class="card h"><h3>Rastrear encomenda</h3><div style="display:flex;gap:8px;margin-top:10px"><input id="qt" placeholder="Ex.: BEN-2026-001248" style="margin:0"><button class="btn s" onclick="sessionStorage.c=val('qt');go('#/admin/track')">Rastrear</button></div></div>
 <div class="card h"><h3>A nossa rota</h3>${routeSvg('hr4')}</div><div class="ban2"><b>O seu mundo,<br>sem limites.</b><p>Gestão segura e rápida.</p></div></div></div>`};

/* ---------- Avaliações (cliente e admin) ---------- */
CV.review=async m=>{const[o,mine]=await Promise.all([api('/orders'),api('/reviews/mine')]),ok=o.some(x=>x.status==='Entregue');
 if(mine){m.innerHTML=`<h1>Avaliar a BENGA</h1><div class="card" style="max-width:560px"><h3>A sua avaliação</h3><p style="margin:10px 0">${stars(mine.stars)}</p><p>${esc(mine.text)}</p><p style="margin-top:12px"><span class="badge ${mine.status==='Publicada'?'Aprovada':'Pendente'}">${mine.status==='Publicada'?'PUBLICADA':'EM REVISÃO'}</span></p><p style="color:var(--tx2);margin-top:10px;font-size:13px">Obrigado por partilhar a sua experiência!</p></div>`;return}
 if(!ok){m.innerHTML=`<h1>Avaliar a BENGA</h1><div class="card" style="max-width:560px"><p>Só pode avaliar depois de receber uma encomenda (estado <b>Entregue</b>). Assim, todas as avaliações vêm de clientes reais.</p><br><a class="btn g" href="#/app/orders">Ver minhas encomendas</a></div>`;return}
 m.innerHTML=`<h1>Avaliar a BENGA</h1><div class="card" style="max-width:560px"><label>Nota<select id="rv_s" class="stp"><option value="5">★★★★★  Excelente</option><option value="4">★★★★☆  Muito bom</option><option value="3">★★★☆☆  Bom</option><option value="2">★★☆☆☆  Fraco</option><option value="1">★☆☆☆☆  Mau</option></select></label><label>O seu comentário<textarea id="rv_t" rows="4" maxlength="400" placeholder="Conte como foi a sua experiência..."></textarea></label><button class="btn" id="rv_g">ENVIAR AVALIAÇÃO</button><p style="color:var(--tx2);font-size:12px;margin-top:10px">A avaliação é publicada depois de revista pela BENGA.</p></div>`;
 $('#rv_g').onclick=async()=>{try{await api('/reviews','POST',{stars:val('rv_s'),text:val('rv_t')});toast('Obrigado! Avaliação enviada.');route()}catch(e){toast(e.message)}}};
AV.reviews=async m=>{const r=await api('/admin/reviews');
 m.innerHTML=`<h1>Avaliações</h1><div class="card">${tbl(['Data','Cliente','Nota','Comentário','Estado','Ações'],r.map(x=>`<tr><td>${dt(x.created_at)}</td><td>${esc(x.name)}<br><small>${esc(x.route||'')}</small></td><td>${stars(x.stars)}</td><td style="white-space:normal;min-width:220px">${esc(x.text)}</td><td><span class="badge ${x.status==='Publicada'?'Aprovada':'Pendente'}">${x.status==='Publicada'?'PUBLICADA':x.status==='Oculta'?'OCULTA':'EM REVISÃO'}</span></td><td>${x.status==='Publicada'?`<button class="btn s g" onclick="rvst(${x.id},'Oculta')">Ocultar</button>`:`<button class="btn s o" onclick="rvst(${x.id},'Publicada')">Publicar</button>`} <button class="btn s r" onclick="rvdel(${x.id})">✕</button></td></tr>`))}</div>
 <div class="card" style="margin-top:16px;max-width:560px"><h3>Adicionar avaliação manualmente</h3><br>${field('Nome (ex.: Ana M.)','ra_n')}${field('Rota (opcional)','ra_r')}<label>Nota<select id="ra_s"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label><label>Comentário<textarea id="ra_t" rows="3"></textarea></label><button class="btn" id="ra_g">Adicionar e publicar</button></div>`;
 window.rvst=async(i,s)=>{await api(`/admin/reviews/${i}/status`,'POST',{status:s});route()};window.rvdel=async i=>{if(confirm('Eliminar esta avaliação?')){await api(`/admin/reviews/${i}/delete`,'POST');route()}};
 $('#ra_g').onclick=async()=>{try{await api('/admin/reviews','POST',{name:val('ra_n'),route:val('ra_r'),stars:val('ra_s'),text:val('ra_t')});toast('Avaliação publicada.');route()}catch(e){toast(e.message)}}};

AV.support=async m=>{const r=await api('/admin/support');
 m.innerHTML=`<h1>Mensagens de suporte</h1><div class="card">${tbl(['Data','Cliente','Assunto','Mensagem','Estado',''],r.map(x=>`<tr><td>${dt(x.created_at)}</td><td>${esc(x.name)}<br><small>${esc(x.phone||'')} · ${esc(x.email)}</small></td><td>${esc(x.subject)}${x.order_code?`<br><small>${esc(x.order_code)}</small>`:''}</td><td style="white-space:normal;min-width:240px">${esc(x.message)}</td><td><span class="badge ${x.status==='Nova'?'Pendente':'Aprovada'}">${esc(x.status).toUpperCase()}</span></td><td><button class="btn s ${x.status==='Nova'?'o':'g'}" onclick="spr(${x.id},'${x.status==='Nova'?'Resolvida':'Nova'}')">${x.status==='Nova'?'Marcar resolvida':'Reabrir'}</button></td></tr>`))}</div>`;
 window.spr=async(i,st)=>{await api(`/admin/support/${i}/resolve`,'POST',{status:st});route()}};

boot();
</script></body></html>
